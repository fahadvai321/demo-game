<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Spin & Win Leaderboard</title>
<style>body{    background:#020617;    color:white;    font-family:Arial;    text-align:center;}
.box{    width:320px;    margin:40px auto;    padding:20px;    background:#0f172a;    border-radius:10px;    box-shadow:0 0 15px #22c55e;}
input{    padding:8px;    width:90%;    border-radius:5px;    border:none;}
button{    margin-top:10px;    padding:10px 20px;    font-size:16px;    border:none;    border-radius:6px;    cursor:pointer;    background:#22c55e;}
button:hover{    background:#16a34a;}
#leaderboard{    margin-top:20px;    text-align:left;}</style></head>
<body>
<div class="box">    <h2> Spin & Win</h2>
    <input id="player" placeholder="Enter your name"><br><br>
    <p>Coins: <span id="coin">100</span></p>
    <button onclick="spin()">SPIN</button>
    <p id="result"></p>
    <hr>
    <h3> Leaderboard</h3>    <div id="leaderboard"></div></div>
<script>let coins = 100;
let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];
function spin(){    let name = document.getElementById("player").value;    if(name === ""){        alert("Enter name first");        return;    }
    if(coins < 10){        document.getElementById("result").innerText = " Not enough coins";        saveScore(name);        return;    }
    coins -= 10;    let win = Math.random() < 0.5;
    if(win){        coins += 30;        document.getElementById("result").innerText = " You Win!";    }else{        document.getElementById("result").innerText = " You Lose!";    }
    document.getElementById("coin").innerText = coins;    saveScore(name);}
function saveScore(name){    let existing = leaderboard.find(p => p.name === name);
    if(existing){        existing.score = coins;    }else{        leaderboard.push({name:name, score:coins});    }
    leaderboard.sort((a,b)=>b.score - a.score);    leaderboard = leaderboard.slice(0,5);
    localStorage.setItem("leaderboard", JSON.stringify(leaderboard));    showLeaderboard();}
function showLeaderboard(){    let html = "";    leaderboard.forEach((p,i)=>{        html += `${i+1}. ${p.name} - ${p.score} coins<br>`;    });    document.getElementById("leaderboard").innerHTML = html;}
showLeaderboard();</script>
</body></html>
