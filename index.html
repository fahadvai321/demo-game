<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spin & Win Demo</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

.game-box {
    margin-top: 80px;
    background: #020617;
    width: 300px;
    padding: 20px;
    border-radius: 10px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 0 15px #22c55e;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px;
}

button:hover {
    background: #16a34a;
}

#result {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>
<body>

<div class="game-box">
    <h2>🎰 Spin & Win</h2>
    <p>Coins: <span id="coin">100</span></p>
    <button onclick="spin()">SPIN</button>
    <div id="result"></div>
</div>

<script>
let coins = 100;

function spin() {
    if (coins < 10) {
        document.getElementById("result").innerText = "❌ Not enough coins";
        return;
    }

    coins -= 10;
    let win = Math.random() < 0.5;

    if (win) {
        coins += 30;
        document.getElementById("result").innerText = "🎉 You Win!";
    } else {
        document.getElementById("result").innerText = "😢 You Lose!";
    }

    document.getElementById("coin").innerText = coins;
}
</script>

</body>
</html>
